<style>
/* ==================== LOADING SCREEN ==================== */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(180deg, oklch(98% 0.005 240), oklch(95% 0.01 240));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 1;
  transition: opacity 0.3s ease-out;
}
.loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.loading-spinner {
  width: 48px;
  height: 48px;
  border: 4px solid oklch(90% 0.008 240);
  border-top-color: oklch(52% 0.16 175);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  margin-top: 16px;
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 14px;
  color: oklch(52% 0.015 240);
}

:root {
  --bg: oklch(98% 0.005 240);
  --surface: oklch(100% 0 0);
  --surface-subtle: oklch(97% 0.008 240);
  --fg: oklch(18% 0.02 240);
  --muted: oklch(52% 0.015 240);
  --border: oklch(90% 0.008 240);
  --border-subtle: oklch(94% 0.005 240);
  --accent: oklch(52% 0.16 175);
  --accent-strong: oklch(43% 0.17 175);
  --accent-tint: oklch(95% 0.04 175);
  --danger: oklch(56% 0.21 27);
  --danger-tint: oklch(96% 0.03 27);
  --warn: oklch(65% 0.17 72);
  --warn-tint: oklch(96% 0.04 72);
  --info: oklch(55% 0.16 250);
  --info-tint: oklch(96% 0.03 250);
  --success: oklch(58% 0.15 145);
  --success-tint: oklch(96% 0.03 145);
  --r: 16px;
  --font-main: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font-main);
  background: linear-gradient(180deg, var(--bg), oklch(95% 0.01 240));
  color: var(--fg);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px 8px 32px;
  min-height: 100vh;
}
